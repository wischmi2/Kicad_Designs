<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ttl{font-size:19px;font-weight:bold;fill:#0b1a30}
    .sub{font-size:12px;fill:#444}
    .l{font-size:1.7px;fill:#1b1b1b}
    .ls{font-size:1.3px;fill:#444}
    .dim{stroke:#555;stroke-width:.11;fill:none}
    .hood{fill:#1d3557;fill-opacity:.88;stroke:#0b1a30;stroke-width:.13;fill-rule:evenodd}
    .sole{fill:#5b7a99;stroke:#0b1a30;stroke-width:.13}
    .pcb{fill:#2f7d4f;stroke:#14361f;stroke-width:.11}
    .mod{fill:#d9b24a;stroke:#6b551a;stroke-width:.11}
    .a121{fill:#f0e1a0;stroke:#6b551a;stroke-width:.11}
    .ghost{fill:#bbb;fill-opacity:.5;stroke:#777;stroke-width:.11;stroke-dasharray:.55 .35}
    .bat{fill:#c9d3dc;stroke:#333;stroke-width:.15}
    .cone{fill:#e63946;fill-opacity:.10;stroke:#e63946;stroke-width:.15}
    .cone45{fill:none;stroke:#e08a00;stroke-width:.13;stroke-dasharray:1 .6}
    .coral{fill:#ff6b57;stroke:#8a2a1d;stroke-width:.11}
    .pipe{fill:#bfe6ff;fill-opacity:.85;stroke:#4a8fb5;stroke-width:.11}
    .rim{fill:#d9d4c7;stroke:#7a7466;stroke-width:.13}
  </style>
  <rect width="780" height="540" fill="#fbfbf8"/>
  <text x="20" y="20" class="ttl">4 PERCH, side section (battery in a leg outside the rim)</text>
  <text x="20" y="36" class="sub">The head overhangs the water, the rim passes under its far end, and the leg hangs on the outside of the wall. Section through the radar centre. Dimensions in mm.</text>

  <g transform="translate(94,240) scale(6)">
    <path class="hood" d="M-9,-4 V-8 L-3,-14 V-26.58 H76.3 V29 H64.3 V-4 Z M-0.5,-4 V-24.08 H73.8 V26.5 H66.8 V-4 Z"/>
    <rect x="-3" y="-22.2" width="2.5" height="7" fill="#fbfbf8" stroke="#0b1a30" stroke-width=".1" stroke-dasharray=".5 .3"/>
    <path class="sole" d="M-9,0 H64.3 V-4 H29 V-1.5 H4 V-4 H-9 Z"/>
    <circle cx="-1.75" cy="-3.2" r="1.0" fill="#e63946" fill-opacity=".7"/>
    <circle cx="62.8" cy="-3.2" r="1.0" fill="#e63946" fill-opacity=".7"/>
    <rect class="ghost" x="-1.46" y="-5.88" width="8" height="1.88"/>
    <rect class="ghost" x="44.26" y="-5.88" width="8" height="1.88"/>
    <rect class="ghost" x="0.19" y="-15.48" width="4.7" height="8"/>
    <rect class="ghost" x="45.91" y="-15.48" width="4.7" height="8"/>
    <rect class="ghost" x="0.04" y="-19.08" width="5" height="2"/>
    <rect class="ghost" x="45.76" y="-19.08" width="5" height="2"/>
    <rect class="mod" x="8.7" y="-5.88" width="18.6" height="1.0"/>
    <rect class="a121" x="13.75" y="-4.88" width="5.5" height="0.88"/>
    <rect class="pcb" x="0" y="-7.48" width="50.8" height="1.6"/>
    <rect class="pcb" x="0" y="-17.08" width="50.8" height="1.6"/>
    <rect x="33.5" y="-8.6" width="2.4" height="1.12" fill="#333"/>
    <rect x="46.5" y="-8.98" width="3.95" height="1.5" fill="#999"/>
    <rect x="46.5" y="-18.58" width="3.95" height="1.5" fill="#999"/>
    <rect x="0" y="-20.34" width="7.35" height="3.26" fill="#9aa"/>
    <rect x="15.7" y="-23.08" width="6.3" height="6" fill="none" stroke="#777" stroke-width=".1" stroke-dasharray=".5 .3"/>
    <rect x="25.4" y="-18.7" width="2" height="1.62" fill="#555"/>
    <rect x="43.9" y="-18.38" width="1.6" height="1.3" fill="#f4a261" stroke="#8a4a10" stroke-width=".08"/>
    <rect class="coral" x="23.2" y="-27.6" width="6.4" height="3.5"/>
    <rect class="coral" x="25.15" y="-24.1" width="2.5" height="5.4"/>
    <rect class="pipe" x="29.9" y="-26.58" width="2.5" height="8.4"/>
    <path d="M50.45,-17.9 H54 C60.8,-17.9 60.8,-8.3 54,-8.3 H50.45" fill="none" stroke="#333" stroke-width=".3"/>
    <!-- leg: cell, cover -->
    <rect class="bat" x="67.3" y="-24" width="6" height="50"/>
    <text class="ls" x="67.9" y="3" transform="rotate(-90 67.9 3)">LiPo 6 x 20 x 50 standing</text>
    <path d="M73.8,-24.08 V26.5" stroke="#ff6b57" stroke-width=".25" stroke-dasharray=".6 .4"/>
    <text class="ls" x="74.1" y="12" transform="rotate(-90 74.1 12)" style="fill:#fff;font-size:1.1px">leg cover, 2nd o-ring</text>
    <!-- lead -->
    <path d="M70,-24 C70,-22 66,-22.5 62,-22.5 H14 C12,-22.5 12,-20.5 12,-18.5" fill="none" stroke="#c0202e" stroke-width=".28" stroke-dasharray=".8 .5"/>
    <text class="ls" x="22" y="-23" style="fill:#c0202e">lead about 80 mm, U5 side</text>
    <!-- AE1 distance -->
    <path d="M67.3,-17.7 L45.5,-17.7" stroke="#8a4a10" stroke-width=".18" stroke-dasharray=".6 .4"/>
    <text class="ls" x="50" y="-14.6" style="fill:#8a4a10">22.6 mm to AE1</text>
    <!-- rim -->
    <rect class="rim" x="51.8" y="0" width="12" height="45"/>
    <text class="ls" x="53.4" y="20">rim 12</text>
    <!-- cone -->
    <path class="cone" d="M16.5,-4 L47.7,45 L-14.7,45 Z"/>
    <path class="cone45" d="M16.5,-4 L51.8,31.3 M16.5,-4 L-19,31.5"/>
    <path d="M16.5,-4 L67.3,26" stroke="#222" stroke-width=".15" stroke-dasharray=".4 .4"/>
    <text class="ls" x="40" y="35" style="fill:#222">59 deg to the cell's lowest corner</text>
    <circle cx="16.5" cy="-4" r=".5" fill="#e63946"/>
    <!-- dims -->
    <g class="dim">
      <path d="M-3,-30.5 H76.3 M-3,-31.3 V-29.7 M76.3,-31.3 V-29.7"/>
      <path d="M79,-26.58 V29 M78.3,-26.58 H79.7 M78.3,29 H79.7 M78.3,0 H79.7"/>
    </g>
    <text class="l" x="24" y="-31.4">79.3 long</text>
    <text class="l" x="80" y="-12">26.6 above</text>
    <text class="l" x="80" y="16">29 below the sole</text>
    <text class="ls" x="-8.8" y="3.8">window 25 x 21 x 1.5, solid</text>
    <text class="ls" x="0.3" y="-21.6" style="fill:#fff;font-size:1.1px">USB-C</text>
    <text class="ls" x="36.5" y="-19.8">AE1</text>
    <text class="ls" x="-15" y="20">cone 65 / 53 deg</text>
    <text class="ls" x="-15" y="21.6" style="fill:#b36b00">45 deg margin (dashed)</text>
    <text class="ls" x="20" y="41" style="fill:#b36b00">45 deg line meets the rim wall 31 mm below the face</text>
    <path d="M16.5,36 V43" stroke="#222" stroke-width=".18"/>
  </g>
</svg>
