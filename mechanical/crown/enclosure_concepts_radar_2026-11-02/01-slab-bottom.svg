<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ttl{font-size:19px;font-weight:bold;fill:#0b1a30}
    .sub{font-size:12px;fill:#444}
    .l{font-size:1.7px;fill:#1b1b1b}
    .ls{font-size:1.4px;fill:#444}
    .sole{fill:#5b7a99;fill-opacity:.35;stroke:#0b1a30;stroke-width:.2}
    .body{fill:none;stroke:#0b1a30;stroke-width:.18;stroke-dasharray:.9 .5}
    .win{fill:#fff;stroke:#0b1a30;stroke-width:.2}
    .pcb{fill:none;stroke:#2f7d4f;stroke-width:.2;stroke-dasharray:.6 .4}
    .post{fill:none;stroke:#777;stroke-width:.15}
    .mod{fill:#d9b24a;fill-opacity:.35;stroke:#6b551a;stroke-width:.15;stroke-dasharray:.5 .3}
    .bat{fill:#c9d3dc;fill-opacity:.7;stroke:#333;stroke-width:.2;stroke-dasharray:.8 .4}
    .cone{fill:none;stroke:#e63946;stroke-width:.18}
    .rule{fill:none;stroke:#e08a00;stroke-width:.18;stroke-dasharray:.9 .5}
  </style>
  <rect width="700" height="520" fill="#fbfbf8"/>
  <text x="20" y="20" class="ttl">1 SLAB, bottom view (from the water side)</text>
  <text x="20" y="36" class="sub">USB end on the left. The U4 battery connector / AE1 edge is at the TOP of this view. Hidden parts dashed.</text>

  <g transform="translate(94,290) scale(6)">
    <rect class="sole" x="-9" y="-37.36" width="79.3" height="68.86"/>
    <rect class="body" x="-3" y="-31.36" width="67.3" height="56.86"/>
    <rect class="win" x="4" y="-21.93" width="25" height="21"/>
    <!-- cone footprints -->
    <ellipse class="cone" cx="16.5" cy="-11.43" rx="2.55" ry="2.0"/>
    <ellipse class="cone" cx="16.5" cy="-11.43" rx="15.3" ry="12.0" stroke-dasharray=".6 .4"/>
    <ellipse class="cone" cx="16.5" cy="-11.43" rx="28.0" ry="21.9" stroke-dasharray=".3 .3"/>
    <!-- board, posts, module -->
    <rect class="pcb" x="0" y="-22.86" width="50.8" height="22.86"/>
    <circle class="post" cx="2.54" cy="-2.54" r="4"/><circle class="post" cx="2.54" cy="-20.32" r="4"/>
    <circle class="post" cx="48.26" cy="-2.54" r="4"/><circle class="post" cx="48.26" cy="-20.32" r="4"/>
    <rect class="mod" x="8.7" y="-18.93" width="18.6" height="15"/>
    <path d="M15.2,-11.43 H17.8 M16.5,-12.73 V-10.13" stroke="#c0202e" stroke-width=".25"/>
    <!-- USB tunnel -->
    <rect x="-3" y="-17.68" width="2.5" height="12.5" fill="#fff" stroke="#0b1a30" stroke-width=".15"/>
    <!-- battery beside -->
    <rect class="bat" x="0" y="2.5" width="50" height="20"/>
    <text class="l" x="8" y="13.5">LiPo 6 x 20 x 50 (U5 side)</text>
    <!-- AE1 -->
    <circle cx="44.67" cy="-20.08" r="1.2" fill="#f4a261" stroke="#8a4a10" stroke-width=".15"/>
    <circle class="rule" cx="44.67" cy="-20.08" r="15"/>
    <circle class="rule" cx="44.67" cy="-20.08" r="20" stroke-opacity=".5"/>
    <!-- screws -->
    <circle cx="-6" cy="-34.36" r="2.0" fill="#333"/><circle cx="-6" cy="28.5" r="2.0" fill="#333"/>
    <circle cx="67.3" cy="-34.36" r="2.0" fill="#333"/><circle cx="67.3" cy="28.5" r="2.0" fill="#333"/>
    <!-- labels -->
    <text class="ls" x="4.5" y="-0.6">window 25 x 21 (1.5 solid)</text>
    <text class="ls" x="29.5" y="-5.0" style="fill:#c0202e">radar centre</text>
    <text class="ls" x="31" y="-28.7" style="fill:#b36b00">15 mm / 20 mm from AE1</text>
    <text class="ls" x="29.7" y="-24.5" style="fill:#8a4a10">AE1</text>
    <text class="ls" x="-8.5" y="-12.5" style="font-size:1.2px" transform="rotate(-90 -8.5 -12.5)">USB-C tunnel</text>
  </g>

  <g font-size="12" fill="#222">
    <text x="520" y="90" font-weight="bold">Sizes</text>
    <text x="520" y="108">body 67.3 x 56.9</text>
    <text x="520" y="124">foot (plinth) 79.3 x 68.9</text>
    <text x="520" y="140">height 26.6</text>
    <text x="520" y="160" font-weight="bold">Cone rings</text>
    <text x="520" y="176" fill="#c0202e">solid: outer face, r 2.5</text>
    <text x="520" y="192" fill="#c0202e">dashed: 20 mm below, r 15</text>
    <text x="520" y="208" fill="#c0202e">dotted: 40 mm below, r 28</text>
    <text x="520" y="224" fill="#555" font-size="11">(rx along the board, ry across;</text>
    <text x="520" y="238" fill="#555" font-size="11">H/E plane axes UNVERIFIED)</text>
    <text x="520" y="262" font-weight="bold">Battery</text>
    <text x="520" y="278">sits at the face plane,</text>
    <text x="520" y="292">14.0 mm sideways: 90 deg</text>
    <text x="520" y="308">to AE1 23.9 mm (plan 22.7,</text>
    <text x="520" y="322">height 7.7), UNVERIFIED rule</text>
    <text x="520" y="346" font-weight="bold">Screws</text>
    <text x="520" y="362">4 x M2.5 in the flare</text>
    <text x="520" y="376">corners, 30 mm+ from</text>
    <text x="520" y="390">the radar axis</text>
  </g>
</svg>
