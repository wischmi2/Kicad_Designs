<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:bold;fill:#0b1a30}
    .sub{font-size:11.5px;fill:#444}
    .t{font-size:11px;fill:#222}
    .l{font-size:2.5px;fill:#1b1b1b}
    .crown{fill:#dfe6ee;stroke:#0b1a30;stroke-width:.15}
    .sole{fill:#5b7a99;stroke:#0b1a30;stroke-width:.15}
    .add{fill:#e07a2f;fill-opacity:.85;stroke:#7a3a0a;stroke-width:.15}
    .cone{fill:#e63946;fill-opacity:.10;stroke:#e63946;stroke-width:.15}
    .m45{fill:none;stroke:#e08a00;stroke-width:.15;stroke-dasharray:1 .6}
    .dim{stroke:#555;stroke-width:.12;fill:none}
  </style>
  <rect width="780" height="470" fill="#fbfbf8"/>
  <text x="14" y="20" class="ttl">Dock ring on a 3 mm plate: section along the Crown at v = 0, and plan</text>
  <text x="14" y="36" class="sub">Scale 4 px per mm (section). The ring grips the foot and the existing 45 degree plinth chamfer. Orange = ring and plate.</text>

  <g transform="translate(132,190) scale(4)">
    <!-- crown -->
    <path class="crown" d="M-25.5,0 H53.8 V-8 L47.8,-14 V-22.08 L43.3,-26.58 H6 V-36.58 H-19.5 V-14 L-25.5,-8 Z"/>
    <rect class="sole" x="-25.5" y="-4" width="79.3" height="4"/>
    <rect x="-12.5" y="-4" width="25" height="2.5" fill="#fbfbf8" stroke="#0b1a30" stroke-width=".1"/>
    <rect x="-7.8" y="-5.88" width="18.6" height="1.88" fill="#d9b24a" stroke="#6b551a" stroke-width=".1"/>
    <circle cx="28.17" cy="-17.7" r=".9" fill="#f4a261" stroke="#8a4a10" stroke-width=".1"/>
    <!-- plate with aperture -->
    <path class="add" d="M-28.7,0 H-17 V3 H-28.7 Z M17,0 H57 V3 H17 Z"/>
    <!-- USB end ring wall and hook tongue (v = +-12, shown projected) -->
    <path class="add" d="M-28.7,0 V-11 H-23.4 V-10.4 L-25.7,-8.1 V0 Z"/>
    <!-- far end wall and latch (v = 0) -->
    <path class="add" d="M57,0 V-11.5 H51.4 V-10.7 L54,-8.1 V0 Z"/>
    <path class="add" d="M57,-11.5 H60.6 V-9.3 H57 Z"/>
    <!-- cone -->
    <path class="cone" d="M0,-4 L34.4,50 L-34.4,50 Z"/>
    <path class="m45" d="M0,-4 L36,32 M0,-4 L-36,32"/>
    <path d="M0,-4 V48" stroke="#c0202e" stroke-width=".12" stroke-dasharray=".8 .5"/>
    <!-- dims -->
    <g class="dim">
      <path d="M-28.7,8 H57 M-28.7,7.3 V8.7 M57,7.3 V8.7"/>
      <path d="M-28.7,13 H0 M-28.7,12.3 V13.7 M0,12.3 V13.7"/>
      <path d="M-17,17 H17 M-17,16.3 V17.7 M17,16.3 V17.7"/>
    </g>
    <text class="l" x="5" y="7.2">ring outer 85.7 (recess 79.7 x 52.3)</text>
    <text class="l" x="-26" y="12.2">28.7 to the axis</text>
    <text class="l" x="-12" y="16.4">aperture dia 34</text>
    <text class="l" x="-29" y="-12.5">hook tongues x2 (12 wide, v +-12)</text>
    <text class="l" x="19" y="-13">flexure latch (40 long in plan)</text>
    <text class="l" x="33" y="-9.5" style="fill:#7a3a0a">thumb tab</text>
    <text class="l" x="-29" y="3.1" style="fill:#7a3a0a">plate 3.0</text>
    <text class="l" x="-22" y="-6.1" style="fill:#fff">sole 4.0</text>
    <text class="l" x="-19.2" y="-17">hook tip z 10.4,</text>
    <text class="l" x="-19.2" y="-14.8">5 mm under the USB tunnel</text>
    <text class="l" x="1.5" y="-1.8">window pocket</text>
    <text class="l" x="29.5" y="-19.5">AE1 (v +8.65)</text>
    <text class="l" x="2" y="42">cone and 45 deg margin: nothing solid inside</text>
  </g>

  <!-- plan -->
  <g transform="translate(620,150) scale(1.9)">
    <rect class="add" x="-28.7" y="-29.15" width="85.7" height="58.3" fill-opacity=".25"/>
    <rect class="sole" x="-25.7" y="-26.15" width="79.7" height="52.3" fill-opacity=".35"/>
    <rect x="-12.5" y="-10.5" width="25" height="21" fill="#fff" stroke="#0b1a30" stroke-width=".3"/>
    <circle r="17" fill="none" stroke="#0b1a30" stroke-width=".4" stroke-dasharray="2 1.2"/>
    <rect class="add" x="-28.7" y="-18" width="3" height="12"/>
    <rect class="add" x="-28.7" y="6" width="3" height="12"/>
    <rect class="add" x="54" y="-20" width="3" height="40"/>
    <rect class="add" x="57" y="-7" width="3.5" height="14"/>
    <circle cx="-26.7" cy="-27.2" r="1.8" fill="#7a3a0a"/><circle cx="-26.7" cy="27.2" r="1.8" fill="#7a3a0a"/>
    <circle cx="55" cy="-27.2" r="1.8" fill="#7a3a0a"/><circle cx="55" cy="27.2" r="1.8" fill="#7a3a0a"/>
    <path d="M-3,0 H3 M0,-3 V3" stroke="#c0202e" stroke-width=".5"/>
    <circle cx="28.17" cy="-8.65" r="1.6" fill="#f4a261" stroke="#8a4a10" stroke-width=".3"/>
    <path d="M-25.7,-26.15 l8,0 l-8,8 z" fill="#7a3a0a" fill-opacity="0"/>
    <path d="M54,-26.15 h-8 l8,8 z" fill="none" stroke="#333" stroke-width=".5"/>
  </g>
  <g class="t">
    <text x="520" y="260" font-weight="bold">Plan (bottom view, USB end left)</text>
    <text x="520" y="276">4 corner bosses: brass M2.5 inserts, plate</text>
    <text x="520" y="290">screws from below (nylon or 316)</text>
    <text x="520" y="308">polarity chamfer on the sole corner</text>
    <text x="520" y="322">(far end, AE1 side): 8 x 8 mm, optional</text>
    <text x="520" y="340">AE1 sits over the latch end: ring and plate</text>
    <text x="520" y="354">are plastic only there</text>
    <text x="520" y="372">Datum cross = radar axis, engraved on every plate</text>
    <text x="520" y="394">Tongues hook the chamfer first (tilt in about</text>
    <text x="520" y="408">12 degrees), then the far end drops and the</text>
    <text x="520" y="422">latch clicks. Press the tab, lift the far end.</text>
  </g>
</svg>
