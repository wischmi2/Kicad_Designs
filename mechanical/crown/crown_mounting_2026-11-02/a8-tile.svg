<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:bold;fill:#0b1a30}
    .sub{font-size:11.5px;fill:#444}
    .t{font-size:11px;fill:#222}
    .l{font-size:2.5px;fill:#1b1b1b}
    .crown{fill:#dfe6ee;stroke:#0b1a30;stroke-width:.15}
    .sole{fill:#5b7a99;stroke:#0b1a30;stroke-width:.15}
    .add{fill:#e07a2f;fill-opacity:.85;stroke:#7a3a0a;stroke-width:.15}
    .cont{fill:#9aa5ad;stroke:#4b565e;stroke-width:.15}
    .mag{fill:#c0202e;fill-opacity:.6;stroke:#600;stroke-width:.12;stroke-dasharray:.6 .4}
    .steel{fill:#444;fill-opacity:.6;stroke:#222;stroke-width:.12;stroke-dasharray:.6 .4}
    .cone{fill:#e63946;fill-opacity:.10;stroke:#e63946;stroke-width:.15}
    .m45{fill:none;stroke:#e08a00;stroke-width:.15;stroke-dasharray:1 .6}
    .dim{stroke:#555;stroke-width:.12;fill:none}
  </style>
  <rect width="780" height="500" fill="#fbfbf8"/>
  <text x="14" y="20" class="ttl">A8 TILE: four magnets in the plate, four stick-on steel patches on the surface (section at v = 0, magnets projected)</text>
  <text x="14" y="36" class="sub">Magnets and patches are 22 mm either side of the beam axis. Surface drawn as a 3 mm sheet with a dia 30 hole. Scale 4 px per mm.</text>

  <g transform="translate(210,200) scale(4)">
    <path class="crown" d="M-25.5,0 H53.8 V-8 L47.8,-14 V-22.08 L43.3,-26.58 H6 V-36.58 H-19.5 V-14 L-25.5,-8 Z"/>
    <rect class="sole" x="-25.5" y="-4" width="79.3" height="4"/>
    <rect x="-12.5" y="-4" width="25" height="2.5" fill="#fbfbf8" stroke="#0b1a30" stroke-width=".1"/>
    <rect x="-7.8" y="-5.88" width="18.6" height="1.88" fill="#d9b24a" stroke="#6b551a" stroke-width=".1"/>
    <circle cx="28.17" cy="-17.7" r=".9" fill="#f4a261" stroke="#8a4a10" stroke-width=".1"/>
    <path class="add" d="M-28.7,0 H-17 V3.5 H-28.7 Z M17,0 H57 V3.5 H17 Z"/>
    <rect class="mag" x="-22" y="0.3" width="10" height="2"/>
    <rect class="mag" x="39" y="0.3" width="10" height="2"/>
    <path class="steel" d="M-27,3.5 H-7 V4 H-27 Z M34,3.5 H54 V4 H34 Z"/>
    <path class="cont" d="M-45,4 H-15 V7 H-45 Z M15,4 H65 V7 H15 Z"/>
    <path class="cone" d="M0,-4 L34.4,50 L-34.4,50 Z"/>
    <path class="m45" d="M0,-4 L40,36 M0,-4 L-40,36"/>
    <path d="M0,-4 V50" stroke="#c0202e" stroke-width=".12" stroke-dasharray=".8 .5"/>
    <g class="dim"><path d="M-15,11 H15 M-15,10.3 V11.7 M15,10.3 V11.7"/></g>
    <text class="l" x="-12" y="10.2">hole dia 30</text>
    <text class="l" x="-24" y="-1" style="fill:#600">magnet dia 10 x 2</text>
    <text class="l" x="33" y="-1" style="fill:#600">magnet (u +44)</text>
    <text class="l" x="-30" y="9.5">steel patch 20 x 20 x 0.5</text>
    <text class="l" x="2" y="16">plate 3.5, pocket 2.3 deep, 1.2 floor</text>
    <text class="l" x="2" y="19">patch inner corner r 13.9 at d 4: margin r 8</text>
    <text class="l" x="2" y="42">beam to the water, 70 mm below the outer face</text>
    <text class="l" x="29.5" y="-19.5">AE1</text>
  </g>

  <g transform="translate(655,115) scale(1.5)">
    <rect class="add" x="-28.7" y="-29.15" width="85.7" height="58.3" fill-opacity=".30"/>
    <circle r="15" fill="#9aa5ad" fill-opacity=".5" stroke="#4b565e" stroke-width=".5"/>
    <circle cx="-17" cy="-22" r="5" class="mag"/><circle cx="-17" cy="22" r="5" class="mag"/>
    <circle cx="44" cy="-22" r="5" class="mag"/><circle cx="44" cy="22" r="5" class="mag"/>
    <rect x="-27" y="-32" width="20" height="20" class="steel" fill-opacity=".25"/><rect x="-27" y="12" width="20" height="20" class="steel" fill-opacity=".25"/>
    <rect x="34" y="-32" width="20" height="20" class="steel" fill-opacity=".25"/><rect x="34" y="12" width="20" height="20" class="steel" fill-opacity=".25"/>
    <circle cx="28.17" cy="-8.65" r="1.6" fill="#f4a261" stroke="#8a4a10" stroke-width=".3"/>
    <rect x="-12.5" y="-10.5" width="25" height="21" fill="none" stroke="#0b1a30" stroke-width=".4"/>
    <path d="M-3,0 H3 M0,-3 V3" stroke="#c0202e" stroke-width=".6"/>
  </g>

  <g class="t">
    <text x="510" y="262" font-weight="bold">What it fits</text>
    <text x="510" y="277">Any flat surface with a hole of dia 25 to 33 that</text>
    <text x="510" y="291">can take four stick-on steel patches (or is steel):</text>
    <text x="510" y="305">plastic lids, stands, steel shelves. Hole rule as A6.</text>
    <text x="510" y="325" font-weight="bold">Metal and AE1</text>
    <text x="510" y="339">Nearest magnet (u +44, v +22): 28 mm from AE1 in 3D</text>
    <text x="510" y="353">(arithmetic in mounting.md). Nearest patch corner:</text>
    <text x="510" y="367">22 mm. The 15 mm plastic zone is clear; range test.</text>
    <text x="510" y="387" font-weight="bold">Beam</text>
    <text x="510" y="401">Magnets 27 mm from the axis, patches 13.9 mm.</text>
    <text x="510" y="415">A steel sheet hole edge IS a metal edge: use dia 34+.</text>
    <text x="510" y="435" font-weight="bold">Level / seal</text>
    <text x="510" y="449">Flat surface only; no gasket (add A6 gasket if wanted).</text>
    <text x="510" y="469">Holding force of Dia 10 x 2 discs: UNVERIFIED.</text>
  </g>
</svg>
