<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:bold;fill:#0b1a30}
    .sub{font-size:11.5px;fill:#444}
    .t{font-size:11px;fill:#222}
    .l{font-size:2.6px;fill:#1b1b1b}
    .crown{fill:#dfe6ee;stroke:#0b1a30;stroke-width:.15}
    .sole{fill:#5b7a99;stroke:#0b1a30;stroke-width:.15}
    .add{fill:#e07a2f;fill-opacity:.85;stroke:#7a3a0a;stroke-width:.15}
    .cont{fill:#b8d4e0;stroke:#4b565e;stroke-width:.15}
    .cone{fill:#e63946;fill-opacity:.10;stroke:#e63946;stroke-width:.15}
    .m45{fill:none;stroke:#e08a00;stroke-width:.15;stroke-dasharray:1 .6}
    .dim{stroke:#555;stroke-width:.12;fill:none}
  </style>
  <rect width="800" height="520" fill="#fbfbf8"/>
  <text x="14" y="20" class="ttl">A7 CLAMP ARM: screw clamp on a tank rim, shelf edge or wall top, Crown overhangs the water (section at v = 0)</text>
  <text x="14" y="36" class="sub">Drawn on a 12 mm glass or acrylic wall, axis 45 mm from the inner face. Edge thickness 3 to 45 mm by moving the back plate in its slots. Scale 4 px per mm.</text>

  <g transform="translate(320,200) scale(4)">
    <path class="crown" d="M-25.5,0 H53.8 V-8 L47.8,-14 V-22.08 L43.3,-26.58 H6 V-36.58 H-19.5 V-14 L-25.5,-8 Z"/>
    <rect class="sole" x="-25.5" y="-4" width="79.3" height="4"/>
    <rect x="-12.5" y="-4" width="25" height="2.5" fill="#fbfbf8" stroke="#0b1a30" stroke-width=".1"/>
    <rect x="-7.8" y="-5.88" width="18.6" height="1.88" fill="#d9b24a" stroke="#6b551a" stroke-width=".1"/>
    <circle cx="28.17" cy="-17.7" r=".9" fill="#f4a261" stroke="#8a4a10" stroke-width=".1"/>
    <path class="add" d="M-66,0 V40 H-63 V3 H-17 V0 Z"/>
    <path class="add" d="M-17,0 H57 V3 H-17 Z"/>
    <path class="add" d="M-28.7,0 V-11 H-23.4 V-10.4 L-25.7,-8.1 V0 Z"/>
    <path class="add" d="M57,0 V-11.5 H51.4 V-10.7 L54,-8.1 V0 Z"/>
    <path class="cont" d="M-57,3 H-45 V75 H-57 Z"/>
    <path d="M-69,25 H-59" stroke="#555" stroke-width="1.2"/>
    <rect x="-59" y="23.5" width="2" height="3" fill="#2aa198"/>
    <path class="cone" d="M0,-4 L34.4,50 L-34.4,50 Z"/>
    <path class="m45" d="M0,-4 L-45,41 M0,-4 L40,36"/>
    <path d="M0,-4 V55" stroke="#c0202e" stroke-width=".12" stroke-dasharray=".8 .5"/>
    <g class="dim">
      <path d="M-45,-2 V-10 M-45,-8 H0 M0,-9 V-7"/>
    </g>
    <text class="l" x="-40" y="-9">L = 45 to the inner face</text>
    <text class="l" x="-92" y="22" style="fill:#7a3a0a">M8 nylon thumbscrew</text>
    <text class="l" x="-92" y="26">+ TPU pad</text>
    <text class="l" x="-56" y="60" style="fill:#2a6b82">wall 12</text>
    <text class="l" x="-58" y="-21">45 deg line meets the wall at d = 41</text>
    <text class="l" x="-58" y="-18">-3 dB cone: d = 67 (0.637) or 86 (0.499)</text>
    <text class="l" x="4" y="58">beam to the water</text>
    <text class="l" x="29.5" y="-19.5">AE1</text>
  </g>

  <g class="t">
    <text x="560" y="230" font-weight="bold">What it fits</text>
    <text x="560" y="244">Tank, sump or reservoir rim,</text>
    <text x="560" y="258">edge 3 to 45 mm thick; also a</text>
    <text x="560" y="272">shelf or bracket edge above the</text>
    <text x="560" y="286">water, and a wall top. Round cans</text>
    <text x="560" y="300">only with a thick flat rim.</text>
    <text x="560" y="320" font-weight="bold">Level</text>
    <text x="560" y="334">Arm sits on the rim top; screw pad</text>
    <text x="560" y="348">sets pitch. Vial on the plate.</text>
    <text x="560" y="368" font-weight="bold">Wall echo</text>
    <text x="560" y="382">L = 45: -3 dB entry 67 / 86 mm;</text>
    <text x="560" y="396">may beat the water echo below</text>
    <text x="560" y="410">80 / 97 mm. Longer arm: L = 100</text>
    <text x="560" y="424">gives 182 / 220 (table in the md).</text>
    <text x="560" y="444" font-weight="bold">Metal / outer face</text>
    <text x="560" y="458">None (nylon M8). Outer face 3 above rim.</text>
    <text x="560" y="478" font-weight="bold">Lid</text>
    <text x="560" y="492">Open tank: no lid. Unscrew and lift.</text>
  </g>
</svg>
