<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <style>
    .ab{fill:#1f3347;stroke:#0f1a24;stroke-width:1.5}
    .pcb{fill:#2f7d5a;stroke:#174a34;stroke-width:1}
    .part{fill:#c9ccd1;stroke:#5b6578;stroke-width:1}
    .nyl{fill:#efe6c8;stroke:#8a7f66;stroke-width:1}
    .coral{fill:#ff7a59;stroke:#c24a2c;stroke-width:1}
    .tpu{fill:#3b3f46;stroke:#15181c;stroke-width:1}
    .rfz{fill:none;stroke:#e0574a;stroke-width:1.2;stroke-dasharray:4 3}
    .bat{fill:none;stroke:#8a7f66;stroke-width:1.2;stroke-dasharray:5 3}
    .dim{stroke:#5b6578;stroke-width:.8;fill:none}
    .wire{fill:none;stroke:#2b2f2d;stroke-width:1.6}
    .t{font-family:Helvetica,Arial,sans-serif;font-size:11px;fill:#1d2533}
    .s{font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:#5b6578}
    .w{font-family:Helvetica,Arial,sans-serif;font-size:9px;fill:#c9d3de}
    .ti{font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1d2533}
  </style>
  <text x="30" y="28" class="ti">00 REFERENCE - the probes and the one board stack every Atlas node shares (revised 2026-10-26)</text>
  <text x="30" y="45" class="s">Probes at 1.6 px/mm; stack side view at 5 px/mm; port plate at 4 px/mm. Probe sizes are NOT confirmed by the Atlas product pages (concepts.md section 1): measure the real probes.</text>

  <!-- PROBES -->
  <text x="30" y="80" class="t">Probes (tip down)</text>
  <path class="wire" d="M63 110 L63 90 Q63 80 75 80"/>
  <rect x="54" y="110" width="19" height="240" rx="5" fill="#d9dde2" stroke="#4a4f57"/>
  <rect x="54" y="110" width="19" height="14" fill="#4fae7b"/>
  <circle cx="63" cy="350" r="9" fill="#cfe8f2" stroke="#5a8ea3"/>
  <text x="44" y="372" class="s">pH 12 x 150</text>
  <path class="wire" d="M113 110 L113 90 Q113 80 125 80"/>
  <rect x="104" y="110" width="19" height="240" rx="5" fill="#d9dde2" stroke="#4a4f57"/>
  <rect x="104" y="110" width="19" height="14" fill="#e8b23a"/>
  <rect x="108" y="346" width="11" height="8" fill="#b9bfc7" stroke="#4a4f57"/>
  <text x="92" y="372" class="s">ORP 12 x 150*</text>
  <path class="wire" d="M163 110 L163 90 Q163 80 175 80"/>
  <rect x="154" y="110" width="19" height="233" rx="5" fill="#d9dde2" stroke="#4a4f57"/>
  <rect x="154" y="110" width="19" height="14" fill="#9a82d6"/>
  <rect x="154" y="318" width="19" height="25" fill="#9aa1ab" stroke="#4a4f57"/>
  <text x="140" y="372" class="s">EC K1.0 12 x 145.5*</text>
  <path class="wire" d="M222 110 L222 90 Q222 80 234 80"/>
  <rect x="209" y="110" width="26" height="192" rx="6" fill="#d9dde2" stroke="#4a4f57"/>
  <rect x="209" y="110" width="26" height="14" fill="#4fc3dc"/>
  <rect x="213" y="292" width="18" height="16" rx="4" fill="#e9d9a8" stroke="#8a7f66"/>
  <text x="196" y="372" class="s">DO 16.5 x 116-124*</text>
  <text x="30" y="394" class="s">All: 1 m cable, male SMA plug as standard (Atlas product pages, checked 2026-10-26).</text>
  <text x="30" y="406" class="s">BNC is an optional +2 USD adapter, so the EC board needs no BNC. * ORP size not found (assumed like pH);</text>
  <text x="30" y="418" class="s">EC and DO sizes are from retailer listings. Collets cover 12 and 16.5. Cable O.D. about 3 mm (assumed).</text>
  <line x1="268" y1="110" x2="268" y2="350" class="dim"/><text x="274" y="236" class="s">~150</text>

  <!-- STACK SIDE VIEW -->
  <text x="330" y="80" class="t">Stack, side view (USB / probe end on the left)</text>
  <rect x="380" y="150" width="256" height="35" fill="#e6e9ee" stroke="#9aa6b5" stroke-dasharray="3 3"/>
  <text x="440" y="166" class="s">feather parts, top envelope Tm 7.0</text>
  <rect x="380" y="185" width="256" height="8" class="pcb"/>
  <rect x="380" y="171" width="38" height="14" class="part"/><text x="382" y="182" class="s">USB-C</text>
  <rect x="604" y="178" width="26" height="7" class="coral"/><text x="596" y="172" class="s">AE1</text>
  <rect x="592" y="150" width="44" height="35" class="rfz"/>
  <rect x="380" y="233" width="256" height="8" class="pcb"/>
  <rect x="380" y="241" width="256" height="8" fill="none" stroke="#9aa6b5" stroke-dasharray="3 3"/>
  <text x="440" y="263" class="s">bottom side flat (J1 pins trimmed) - S1b 1.5</text>
  <rect x="470" y="221" width="40" height="12" class="part"/><text x="474" y="230" class="s">U2</text>
  <rect x="540" y="211" width="34" height="22" class="part"/><text x="544" y="224" class="s">U4 4.5</text>
  <rect x="342" y="206" width="62" height="16" class="part"/><rect x="342" y="209" width="14" height="10" fill="#e8c46a" stroke="#8a7f66"/>
  <text x="318" y="200" class="s">J1 SMA</text>
  <line x1="342" y1="232" x2="380" y2="232" class="dim"/><text x="338" y="248" class="s">5.6 or 7.6 out?</text>
  <rect x="393" y="193" width="12" height="40" class="nyl"/><rect x="615" y="193" width="12" height="40" class="nyl"/>
  <text x="352" y="296" class="s">nylon standoffs at the USB / probe end (isolated side)</text>
  <path class="wire" d="M628 189 L660 189 Q672 189 672 201 L672 221 Q672 237 660 237 L628 237"/>
  <text x="680" y="216" class="s">14-way FFC fold</text>
  <rect x="353" y="270" width="200" height="35" class="bat"/>
  <text x="360" y="288" class="s">battery 40 x 25 x 7 (size class). End held 10 mm short of the antenna zone</text>
  <text x="360" y="300" class="s">so it overhangs the USB end by about 5 mm (sits in the foot).</text>
  <line x1="372" y1="193" x2="372" y2="233" class="dim"/><text x="344" y="217" class="s">gap 8</text>
  <line x1="648" y1="150" x2="648" y2="249" class="dim"/><text x="652" y="150" class="s">Ds about 19.5</text>
  <line x1="380" y1="320" x2="636" y2="320" class="dim"/><text x="480" y="334" class="s">50.8</text>
  <text x="330" y="358" class="s">Isolated copper (sens1-style, probe end) sits 8 mm under the feather's plated GND hole column: nylon at that end.</text>
  <text x="330" y="372" class="s">sens1 GND under the antenna corner: keep-out request R1 (concepts.md section 6).</text>

  <!-- PORT PLATE -->
  <text x="700" y="80" class="t">Port plate, seen from the foot</text>
  <rect x="700" y="100" width="128" height="134" rx="14" class="ab"/>
  <rect x="728" y="118" width="72" height="28" rx="8" fill="#101c28" stroke="#c9d3de"/>
  <text x="738" y="136" class="w">USB-C 12.5 x 7</text>
  <circle cx="764" cy="186" r="14" fill="#101c28" stroke="#c9d3de"/>
  <text x="716" y="222" class="w">SMA hole dia 6.8</text>
  <line x1="838" y1="132" x2="838" y2="186" class="dim"/><text x="844" y="162" class="s">9.6</text>
  <text x="700" y="256" class="s">Both centred on the board width, 9.6 mm apart</text>
  <text x="700" y="268" class="s">in depth: 2.7 mm of wall between the holes.</text>
  <text x="700" y="286" class="s">Probe boot: TPU dia 12 x 28. USB overmould</text>
  <text x="700" y="298" class="s">max 6.5 deep, or the two touch (0.35 mm gap).</text>
  <text x="700" y="320" class="s">Barrel (dia 6.35 thread) passes the plate; the</text>
  <text x="700" y="332" class="s">probe plug threads on outside. Needs: wall 2.5</text>
  <text x="700" y="344" class="s">+ 0.5 + 4 mm thread = 7 mm of barrel past the</text>
  <text x="700" y="356" class="s">board edge. EC/DO notes say 7.6, ORP says 5.6:</text>
  <text x="700" y="368" class="s">PCB request P1, verify against the jack drawing.</text>
  <text x="700" y="386" class="s">Fallback: pigtail to a sealed SMA bulkhead.</text>
  <!-- type band legend -->
  <text x="30" y="458" class="t">Type colour (one shell, one swappable band)</text>
  <rect x="30" y="468" width="26" height="14" fill="#4fae7b"/><text x="62" y="479" class="s">ph</text>
  <rect x="100" y="468" width="26" height="14" fill="#e8b23a"/><text x="132" y="479" class="s">orp</text>
  <rect x="180" y="468" width="26" height="14" fill="#4fc3dc"/><text x="212" y="479" class="s">do</text>
  <rect x="250" y="468" width="26" height="14" fill="#9a82d6"/><text x="282" y="479" class="s">ec</text>
  <rect x="320" y="468" width="26" height="14" fill="#e9e4d4" stroke="#8a7f66"/><text x="352" y="479" class="s">lvl (water level)</text>
  <text x="30" y="500" class="s">Antenna: AE1 at the far end, plastic only within 15 mm, 10 mm from the battery, 25 mm from water. Foot inserts are 50+ mm from AE1.</text>
  <text x="30" y="514" class="s">Conformal coat both boards (mask J1, CN1, SW1, standoff holes). 2 g silica gel and an ePTFE vent in every shell.</text>
  <text x="30" y="528" class="s">EC: the SMA shell is a live electrode (EC OEM has no probe ground): nothing metal may touch the plug or its shield.</text>
</svg>
