<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" font-family="Segoe UI, Arial, sans-serif">
<defs>
<g id="board">
<rect width="360" height="240" rx="10" fill="#6d7d58" stroke="#2f3a26" stroke-width="1.5"/>
