<g font-size="9" fill="#fff"><text x="82" y="30">J1</text><text x="160" y="21">JP1</text><text x="283" y="30">J2</text><text x="200" y="22">J3</text><text x="236" y="17">J4</text><text x="75" y="212">J5</text><text x="4" y="150">J6 USB-C</text><text x="136" y="85">XM RST</text><text x="198" y="151">SWD RST</text></g>
