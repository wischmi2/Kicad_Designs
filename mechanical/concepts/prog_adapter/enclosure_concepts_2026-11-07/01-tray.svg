<rect width="520" height="620" fill="#f6f4ef"/>
<text x="40" y="28" font-size="18" font-weight="700" fill="#1c2b45">1  BENCH TRAY (open top, tilt riser)</text>
<text x="40" y="45" font-size="11" fill="#555">Top view, 5 px/mm. Board visible, all silk legends readable.</text>
<!-- tray outer -->
<rect x="40" y="60" width="387" height="337" rx="12" fill="#1c2b45"/>
<rect x="50.5" y="70.5" width="366" height="246" rx="8" fill="#14203a"/>
<use href="#board" x="53.5" y="73.5"/>
<!-- wall notches -->
<g stroke="#f6f4ef" stroke-width="6"><line x1="40" y1="227" x2="40" y2="274"/><line x1="40" y1="148" x2="40" y2="192"/><line x1="335" y1="60" x2="380" y2="60"/></g>
<g font-size="9" fill="#555"><text x="2" y="252">USB-C</text><text x="2" y="172">FTDI</text><text x="335" y="55">ribbon notch</text></g>
<!-- front bay -->
<rect x="50.5" y="322" width="366" height="66" rx="6" fill="#14203a"/>
