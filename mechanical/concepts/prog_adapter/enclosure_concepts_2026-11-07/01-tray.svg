<rect x="60" y="522" width="40" height="13" fill="#e8604c" opacity=".8"/>
</g>
<g fill="#e8604c"><rect x="50" y="560" width="30" height="6"/><rect x="340" y="560" width="30" height="6"/></g>
<text x="40" y="590" font-size="10" fill="#555">Orange = TPU feet / pockets. Walls end about 5 mm over the board; headers stand proud.</text>
<text x="40" y="605" font-size="10" fill="#555">77 x 67 x 14 mm flat, about 77 x 67 x 21 mm on the riser (rear).</text>
