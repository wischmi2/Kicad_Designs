<!-- side view -->
<text x="40" y="425" font-size="11" fill="#555">Side view, 8 deg tilt toward user (front = left). Riser is a separate print.</text>
<line x1="20" y1="560" x2="500" y2="560" stroke="#999"/>
<polygon points="40,545 377,498 377,560 40,560" fill="#8a8a8a" stroke="#444"/>
