<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" font-family="Segoe UI, Arial, sans-serif">
<defs>
<g id="board">
<rect width="360" height="240" rx="10" fill="#6d7d58" stroke="#2f3a26" stroke-width="1.5"/>
<g fill="#222" stroke="#000"><rect x="78.5" y="33.5" width="77" height="45"/><rect x="162" y="24" width="14" height="32.5"/><rect x="200" y="26" width="26.5" height="58" fill="#444"/><rect x="233.5" y="21" width="40" height="81"/><rect x="281" y="33.5" width="46" height="77.5"/><rect x="72.5" y="215" width="40" height="14.5"/></g>
<rect x="132" y="88.5" width="41" height="31" fill="#ddd" stroke="#444"/><rect x="197.5" y="154.5" width="42.5" height="33" fill="#ddd" stroke="#444"/>
<rect x="0" y="153.5" width="36" height="47" fill="#f2f2f2" stroke="#666"/>
<g fill="#e8c24a" stroke="#222"><circle cx="37.5" cy="80" r="5"/><circle cx="37.5" cy="95" r="5"/><circle cx="37.5" cy="110" r="5"/></g>
<g fill="#111"><rect x="7" y="61" width="16" height="9" rx="4"/><rect x="7" y="120" width="16" height="9" rx="4"/></g>
</g>
</defs>
<rect width="520" height="620" fill="#f6f4ef"/>
<text x="40" y="28" font-size="18" font-weight="700" fill="#1c2b45">3  QUADPOST (exposed frame)</text>
<text x="40" y="45" font-size="11" fill="#555">Top view. Plate, board and open frame on four corner posts.</text>
<!-- bottom plate outline -->
<rect x="40" y="60" width="390" height="270" rx="14" fill="#14203a" opacity=".35" stroke="#1c2b45" stroke-dasharray="5 4"/>
<use href="#board" x="55" y="75"/>
<!-- frame: rails on top, bottom, right; left side open -->
<g fill="#1c2b45">
<rect x="55" y="75" width="360" height="14"/>
<rect x="55" y="301" width="360" height="14"/>
<rect x="401" y="75" width="14" height="240"/>
</g>
<!-- towers -->
<g fill="#2a3d63" stroke="#e8604c" stroke-width="1.5"><circle cx="72" cy="92" r="22"/><circle cx="398" cy="92" r="22"/><circle cx="72" cy="298" r="22"/><circle cx="398" cy="298" r="22"/></g>
<g fill="#0d1526"><circle cx="72" cy="92" r="8"/><circle cx="398" cy="92" r="8"/><circle cx="72" cy="298" r="8"/><circle cx="398" cy="298" r="8"/></g>
<g stroke="#f6f4ef" stroke-width="6"><line x1="40" y1="228" x2="40" y2="275"/></g>
<text x="2" y="252" font-size="9" fill="#555">USB-C (left open)</text>
<text x="2" y="172" font-size="9" fill="#555">FTDI + tie</text>
<text x="300" y="352" font-size="16" fill="#e8604c" font-weight="700">prog</text>
<!-- side -->
<text x="40" y="380" font-size="11" fill="#555">Front view. Towers rise 10 mm over the PCB, above the tallest header.</text>
<line x1="20" y1="520" x2="500" y2="520" stroke="#999"/>
<g fill="#e8604c"><rect x="50" y="520" width="26" height="6"/><rect x="394" y="520" width="26" height="6"/></g>
<rect x="40" y="505" width="390" height="15" fill="#1c2b45"/>
<g fill="#2a3d63"><rect x="62" y="480" width="22" height="25"/><rect x="388" y="480" width="22" height="25"/></g>
<rect x="55" y="472" width="360" height="8" fill="#6d7d58" stroke="#2f3a26"/>
<g fill="#222"><rect x="134" y="427" width="77" height="45"/><rect x="336" y="427" width="46" height="45"/></g>
<rect x="55" y="457" width="360" height="15" fill="none"/>
<g fill="#1c2b45"><rect x="55" y="457" width="360" height="15" opacity="0"/><rect x="55" y="450" width="360" height="22" opacity="0"/></g>
<rect x="55" y="458" width="360" height="14" fill="none"/>
<g fill="#2a3d63"><rect x="62" y="422" width="22" height="50"/><rect x="388" y="422" width="22" height="50"/></g>
<rect x="55" y="456" width="360" height="0" />
<g stroke="#888" stroke-dasharray="4 3"><line x1="73" y1="412" x2="73" y2="505"/><line x1="399" y1="412" x2="399" y2="505"/></g>
<rect x="66" y="412" width="14" height="6" fill="#aaa"/><rect x="392" y="412" width="14" height="6" fill="#aaa"/>
<text x="40" y="560" font-size="10" fill="#555">Orange = TPU feet and coral tower rings. Frame rails grip the PCB edge on 3 sides.</text>
<text x="40" y="575" font-size="10" fill="#555">78 x 54 x about 20 mm. Everything prints flat, no supports.</text>
</svg>
