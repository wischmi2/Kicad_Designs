<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
  <style>
    .frame{fill:#ff6a2b;stroke:#8f3510;stroke-width:2}
    .bez{fill:#22262c;stroke:#0e1013;stroke-width:1.5}
    .clear{fill:#cfe6ee;fill-opacity:.45;stroke:#3a9bb8;stroke-width:1.5}
    .pack{fill:#c9ccd1;stroke:#4a4f57;stroke-width:2}
    .w{fill:#0b0f14;stroke:#9fb0c4;stroke-width:1}
    .scr{fill:#d9dde3;stroke:#1d2533;stroke-width:1.2}
    .acc{fill:#ffd23f;stroke:#9a7b00;stroke-width:1.2}
    .cab{fill:none;stroke:#1d2533;stroke-width:3}
    .bail{fill:none;stroke:#4a4f57;stroke-width:4}
    .bail2{fill:none;stroke:#4a4f57;stroke-width:2;stroke-dasharray:6 4}
    .ant{fill:none;stroke:#3a9bb8;stroke-width:2;stroke-dasharray:5 3}
    .ray{stroke:#ff7a59;stroke-width:2;stroke-opacity:.7}
    .t{font-family:Helvetica,Arial,sans-serif;font-size:11px;fill:#1d2533}
    .s{font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:#5b6578}
    .ti{font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1d2533}
  </style>
  <text x="40" y="30" class="ti">05 FIELD UNIT - an honest instrument: exposed screws, clear back, antenna flag, clip-on power pack</text>
  <text x="40" y="47" class="s">Core 82 W x 50 H x 26 D; with pack 82 x 74; flag adds 22 mm. Scale 2.5 px/mm. LCD stacked on gateway, parts facing rear.</text>

  <!-- FRONT -->
  <text x="40" y="365" class="t">FRONT</text>
  <path d="M40 205 C18 205 18 75 142 75 C266 75 266 205 245 205" class="bail2"/>
  <polygon points="185,150 190,98 232,95 235,150" class="clear"/>
  <rect x="196" y="104" width="30" height="40" class="ant"/>
  <rect x="40" y="150" width="205" height="125" rx="6" class="frame"/>
  <rect x="58" y="160" width="169" height="105" rx="4" class="bez"/>
  <rect x="92.5" y="172.75" width="105" height="79.5" rx="2" class="w"/>
  <rect x="134" y="140" width="26" height="10" rx="2" class="acc"/>
  <circle cx="50" cy="160" r="5" class="scr"/><circle cx="235" cy="160" r="5" class="scr"/>
  <circle cx="50" cy="265" r="5" class="scr"/><circle cx="235" cy="265" r="5" class="scr"/>
  <rect x="40" y="277" width="205" height="58" rx="6" class="pack"/>
  <text x="60" y="311" class="t">POWER PACK  2000 mAh</text>
  <circle cx="225" cy="306" r="6" class="scr"/>
  <path d="M42 300 C12 300 12 227 40 227" class="cab"/>
  <rect x="150" y="333" width="20" height="5" fill="#1d2533"/>
  <text x="40" y="383" class="s">Orange printed frame, black bezel plate, M2 button-head screws on show. Yellow top lever = USER.</text>
  <text x="40" y="397" class="s">Antenna flag: translucent tab with the Molex 219611 FPC inside, the only thing above the frame.</text>
  <text x="40" y="411" class="s">Visible USB-C "umbilical" from the pack into J1; unplug the pack and the core runs from any USB-C.</text>

  <!-- SIDE -->
  <text x="320" y="365" class="t">SIDE</text>
  <rect x="320" y="150" width="7.5" height="125" class="bez"/>
  <rect x="327.5" y="150" width="50" height="125" class="frame"/>
  <rect x="377.5" y="150" width="7.5" height="125" class="clear"/>
  <rect x="320" y="277" width="65" height="58" rx="5" class="pack"/>
  <polygon points="345,150 348,98 368,96 370,150" class="clear"/>
  <circle cx="352" cy="205" r="5" class="scr"/>
  <line x1="352" y1="205" x2="440" y2="335" class="bail"/>
  <line x1="390" y1="190" x2="410" y2="182" class="ray"/><line x1="390" y1="205" x2="412" y2="205" class="ray"/><line x1="390" y1="220" x2="410" y2="228" class="ray"/>
  <text x="450" y="160" class="t">Clear rear plate (PETG or acrylic):</text>
  <text x="450" y="174" class="s">the gateway is on show; D3-D5 face rear and</text>
  <text x="450" y="188" class="s">wash the wall; frosted edge glows at the top</text>
  <text x="450" y="214" class="t">RESET / ISP: 2 holes in the rear plate,</text>
  <text x="450" y="228" class="s">straight onto the switches (they face rear)</text>
  <text x="450" y="254" class="t">USER: top lever on a 1.75 mm filament pin,</text>
  <text x="450" y="268" class="s">bell-crank presses the switch from behind</text>
  <text x="450" y="300" class="t">Bail: desk kickstand, hanging loop, or</text>
  <text x="450" y="314" class="s">folded flat for a wall screw (TPU or PETG)</text>
  <text x="450" y="340" class="s">Pack: LiPo + PowerBoost, 2 thumb screws, own charge USB-C</text>
  <text x="320" y="383" class="s">Print: all flat plates (frame, bezel, back, pack shells) = fast, no supports. Many parts and a</text>
  <text x="320" y="397" class="s">small mechanism: most assembly effort of the five concepts.</text>
</svg>
