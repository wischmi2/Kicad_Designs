<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
  <style>
    .pad{fill:#e9e4d8;stroke:#1d2533;stroke-width:2}
    .bud{fill:#f4f2ee;stroke:#1d2533;stroke-width:2}
    .cap{fill:#ff7a59;fill-opacity:.85;stroke:#c24a2c;stroke-width:1.5}
    .win{fill:#2b3f63;stroke:#9fb0c4;stroke-width:1.2}
    .sec{fill:#e3e8ee;stroke:#1d2533;stroke-width:2}
    .pcb{fill:#1f5a40;stroke:#0f3826;stroke-width:1}
    .pcb2{fill:#2f6f8f;stroke:#173a4c;stroke-width:1}
    .conn{fill:#d2a64b;stroke:#8a6420;stroke-width:.8}
    .tpu{fill:#3b3f46;stroke:#15181c;stroke-width:1}
    .coral{fill:#ff7a59;stroke:#c24a2c;stroke-width:1}
    .bat{fill:#c9ccd1;fill-opacity:.6;stroke:#4a4f57;stroke-width:1;stroke-dasharray:5 3}
    .rf{fill:#e0574a}
    .rfz{fill:none;stroke:#e0574a;stroke-width:1.2;stroke-dasharray:4 3}
    .water{fill:#9fd0e3;fill-opacity:.55;stroke:none}
    .wl{stroke:#5a8ea3;stroke-width:1.5}
    .coax{fill:none;stroke:#2b2f2d;stroke-width:2}
    .infill{fill:#e9e4d8;stroke:#b9b2a2;stroke-width:.6}
    .dim{stroke:#5b6578;stroke-width:.8;fill:none}
    .t{font-family:Helvetica,Arial,sans-serif;font-size:11px;fill:#1d2533}
    .s{font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:#5b6578}
    .ti{font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1d2533}
  </style>
  <text x="40" y="30" class="ti">02 LILY - a floating pad with a bud: panel faces the sky, probe hangs through the pad's notch</text>
  <text x="40" y="47" class="s">Scale 2 px/mm. Pad 176 x 112 x 24, bud dia 42 rising 64 mm above the deck. Sand / white ASA (keeps the cell cool), coral cap. Hardest concept to seal.</text>

  <!-- TOP VIEW origin (40,80) -->
  <text x="40" y="74" class="t">Top</text>
  <path class="pad" d="M120 80 L332 80 Q392 80 392 140 L392 176 L338 196 L392 216 L392 236 Q392 304 320 304 L120 304 Q40 304 40 224 L40 160 Q40 80 120 80 Z"/>
  <rect class="win" x="54" y="113" width="200" height="158" rx="6"/>
  <rect x="60" y="119" width="188" height="146" fill="none" stroke="#9fb0c4" stroke-width=".8" stroke-dasharray="3 3"/>
  <text class="s" x="96" y="196" style="fill:#c9d3de">LL200-2.4-75 (94 x 73) under a</text>
  <text class="s" x="96" y="209" style="fill:#c9d3de">2 mm PC/acrylic window, 3 deg crown</text>
  <circle class="bud" cx="300" cy="192" r="42"/>
  <circle class="cap" cx="300" cy="192" r="30"/>
  <circle cx="300" cy="192" r="6" fill="#f4f2ee" stroke="#c24a2c"/>
  <text class="s" x="270" y="250">bud: boards upright</text>
  <circle cx="356" cy="196" r="7" fill="#e6e6e6" stroke="#4a4f57"/>
  <text class="s" x="350" y="322">probe hangs in the notch</text>
  <path d="M300 150 L300 118" stroke="#e0574a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text class="s" x="306" y="122">antenna corner faces the notch,</text>
  <text class="s" x="306" y="134">away from the panel</text>
  <line class="dim" x1="40" y1="324" x2="392" y2="324"/><text class="s" x="200" y="337">176</text>
  <!-- tether loop -->
  <path d="M40 192 Q22 192 22 182" fill="none" stroke="#2b2f2d" stroke-width="1.5"/>
  <text class="s" x="2" y="176">tether</text>

  <!-- SECTION origin (460,80) at 2 px/mm, through the bud and notch -->
  <text x="460" y="74" class="t">Section through the bud</text>
  <rect class="water" x="450" y="300" width="420" height="120"/>
  <line class="wl" x1="450" y1="300" x2="870" y2="300"/>
  <text class="s" x="452" y="316">waterline (draft about 14, to check)</text>
  <!-- pad: deck at y 280 (10 mm freeboard), bottom at y 328 -->
  <path class="infill" d="M460 280 L700 280 L700 328 L476 328 Q460 328 460 312 Z"/>
  <text class="s" x="470" y="300">solid buoyant pad, 4+ walls, no electronics</text>
  <rect class="win" x="470" y="276" width="190" height="4"/>
  <!-- bud: dia 42 = 84 px, from x 690 to 774; deck y 280; top y 152 -->
  <path class="sec" d="M690 280 L690 160 Q690 152 698 152 L766 152 Q774 152 774 160 L774 262 L774 280"/>
  <path class="cap" d="M686 160 Q732 128 778 160 L778 168 L686 168 Z"/>
  <line x1="690" y1="168" x2="774" y2="168" stroke="#1d2533" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="s" x="790" y="150">screw cap, face o-ring</text>
  <text class="s" x="790" y="162">(no metal, top = antenna)</text>
  <!-- heel overhangs the notch -->
  <path class="sec" d="M774 262 L800 262 L800 290 L740 290 L740 280"/>
  <rect class="conn" x="782" y="290" width="12" height="12"/>
  <path class="coax" d="M788 302 L788 316"/>
  <rect x="782" y="316" width="12" height="70" rx="6" fill="#e6e6e6" stroke="#4a4f57"/>
  <text class="s" x="804" y="318">SMA bulkhead faces down</text>
  <text class="s" x="804" y="330">into the notch, above water;</text>
  <text class="s" x="804" y="342">TPU boot over the mated plug</text>
  <!-- boards upright: board length 50.8 = 101.6 px; USB end at y 268, far end y 166 -->
  <rect class="pcb" x="712" y="166" width="3.2" height="101.6"/>
  <rect class="pcb2" x="735" y="166" width="3.2" height="101.6"/>
  <rect class="rf" x="709" y="174" width="3" height="6.4"/>
  <rect class="rfz" x="700" y="166" width="16" height="18"/>
  <rect class="bat" x="742" y="196" width="16" height="80"/>
  <circle class="coral" cx="690" cy="215" r="5"/>
  <text class="s" x="610" y="212">TPU key</text>
  <rect x="686" y="205" width="6" height="2.5" fill="#ffd1c2" stroke="#c24a2c" stroke-width=".6"/>
  <text class="s" x="604" y="200">light pipe</text>
  <text class="s" x="460" y="120">antenna about 55-60 mm above the water</text>
  <line class="dim" x1="460" y1="124" x2="704" y2="174"/>
  <text class="s" x="460" y="400">Battery low in the bud as ballast; trim washers go under the</text>
  <text class="s" x="460" y="412">panel end, more than 60 mm from the antenna. Check buoyancy</text>
  <text class="s" x="460" y="424">and the righting moment from Fusion mass properties.</text>
</svg>
