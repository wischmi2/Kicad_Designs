<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
  <style>
    .ab{fill:#1f3347;stroke:#0f1a24;stroke-width:2}
    .brow{fill:#2c4660;stroke:#0f1a24;stroke-width:1}
    .sec{fill:#e3e8ee;stroke:#1d2533;stroke-width:2}
    .pcb{fill:#1f5a40;stroke:#0f3826;stroke-width:1}
    .pcb2{fill:#2f6f8f;stroke:#173a4c;stroke-width:1}
    .conn{fill:#d2a64b;stroke:#8a6420;stroke-width:.8}
    .tpu{fill:#3b3f46;stroke:#15181c;stroke-width:1}
    .coral{fill:#ff7a59;stroke:#c24a2c;stroke-width:1}
    .pipe{fill:#ffd1c2;stroke:#c24a2c;stroke-width:.8}
    .bat{fill:#c9ccd1;fill-opacity:.6;stroke:#4a4f57;stroke-width:1;stroke-dasharray:5 3}
    .rf{fill:#e0574a}
    .rfz{fill:none;stroke:#e0574a;stroke-width:1.2;stroke-dasharray:4 3}
    .dash{fill:none;stroke:#9fb0c4;stroke-width:1;stroke-dasharray:4 3}
    .ffc{fill:none;stroke:#c08a2e;stroke-width:2}
    .coax{fill:none;stroke:#2b2f2d;stroke-width:2.2}
    .so{fill:#9aa3ad;stroke:#4a4f57;stroke-width:.6}
    .glass{fill:#cfe8f2;stroke:#5a8ea3;stroke-width:1.5}
    .water{fill:#9fd0e3;fill-opacity:.6;stroke:none}
    .sol{fill:#2b3f63;stroke:#9fb0c4;stroke-width:1}
    .dim{stroke:#5b6578;stroke-width:.8;fill:none}
    .t{font-family:Helvetica,Arial,sans-serif;font-size:11px;fill:#1d2533}
    .s{font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:#5b6578}
    .lbl{font-family:Helvetica,Arial,sans-serif;font-size:9px;fill:#c9d3de}
    .ti{font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1d2533}
  </style>
  <text x="40" y="30" class="ti">01 TIDEMARK - a slim Ledger-family column that hangs on the rim; the probe drops straight down</text>
  <text x="40" y="47" class="s">Scale 3 px/mm (front, section), 1.5 px/mm (in use). Sketch values Hs = 8, battery 40 x 25 x 7. Abyss PETG indoors, Sand ASA outdoors.</text>

  <!-- FRONT VIEW, origin (60,90), 32 W x 64 toe + heel to 78 -->
  <text x="60" y="78" class="t">Front</text>
  <rect class="ab" x="60" y="282" width="96" height="42" rx="8" opacity=".75"/>
  <rect class="ab" x="60" y="90" width="96" height="192" rx="12"/>
  <rect class="brow" x="62" y="92" width="92" height="58" rx="11"/>
  <text class="lbl" x="70" y="108">brow 20 mm</text>
  <text class="lbl" x="70" y="119">leans back 20 deg</text>
  <rect class="dash" x="73.7" y="120" width="68.6" height="152.4"/>
  <rect class="rfz" x="122.9" y="120" width="19.4" height="26"/>
  <rect class="rf" x="132" y="133" width="4.8" height="9.6"/>
  <circle class="pipe" cx="126.5" cy="180.6" r="3.75"/>
  <circle class="coral" cx="136" cy="193.2" r="10.5"/>
  <text class="lbl" x="66" y="200">boards</text>
  <text class="lbl" x="66" y="211">(dashed)</text>
  <text class="lbl" x="80" y="262">ph</text>
  <rect class="tpu" x="89" y="282" width="38" height="7" rx="2"/>
  <line class="dim" x1="60" y1="340" x2="156" y2="340"/><text class="s" x="96" y="353">32</text>
  <line class="dim" x1="44" y1="90" x2="44" y2="324"/><text class="s" x="22" y="210">78</text>
  <text class="s" x="168" y="138">antenna corner</text>
  <text class="s" x="168" y="150">(plastic only)</text>
  <text class="s" x="168" y="183">yellow LED via</text>
  <text class="s" x="168" y="195">coral eye 2.5 mm</text>
  <text class="s" x="168" y="207">coral TPU key 7 mm</text>
  <text class="s" x="168" y="300">USB-C TPU bung</text>
  <text class="s" x="168" y="312">(toe, faces down)</text>

  <!-- SIDE SECTION, origin (290,90), depth 32: front on the left -->
  <text x="290" y="78" class="t">Section (front left, tank side right)</text>
  <path class="sec" d="M311.9 90 L386 90 L386 324 L329 324 L329 282 L290 282 L290 150 Z"/>
  <!-- foot cap parting line -->
  <line class="dash" x1="290" y1="273" x2="329" y2="273"/>
  <line class="dash" x1="329" y1="315" x2="386" y2="315"/>
  <!-- main board and parts -->
  <rect class="pcb" x="318.5" y="120" width="4.8" height="152.4"/>
  <rect class="conn" x="308.6" y="250.2" width="9.9" height="22.3"/>
  <rect class="conn" x="300.5" y="227.9" width="18" height="19"/>
  <rect class="conn" x="313.7" y="188.7" width="4.8" height="9"/>
  <rect class="rf" x="316" y="133.5" width="2.5" height="9.6"/>
  <!-- key: membrane + plunger -->
  <rect class="coral" x="287" y="186" width="5" height="15"/>
  <rect class="tpu" x="292" y="191.7" width="21" height="3"/>
  <!-- light pipe -->
  <rect class="pipe" x="290" y="179" width="27" height="3.3"/>
  <!-- standoffs -->
  <rect class="so" x="323.3" y="258.8" width="24" height="12"/>
  <rect class="so" x="323.3" y="121.6" width="24" height="12"/>
  <!-- sens1 -->
  <rect class="pcb2" x="347.3" y="120" width="4.8" height="152.4"/>
  <!-- FFC loop -->
  <path class="ffc" d="M315.5 120 L315.5 112 A14.4 14.4 0 0 1 344.3 112 L344.3 120"/>
  <!-- SMA + pigtail + bulkhead -->
  <rect class="conn" x="344" y="272.4" width="12" height="16"/>
  <path class="coax" d="M350 288 L350 300 Q350 306 356 306 L360 306 Q366 306 366 312 L366 316"/>
  <rect class="conn" x="360" y="314" width="12" height="18"/>
  <!-- battery -->
  <rect class="bat" x="355" y="196.5" width="21" height="120"/>
  <!-- gland for solar lead -->
  <rect class="tpu" x="374" y="324" width="8" height="8"/>
  <!-- USB bung -->
  <rect class="tpu" x="305" y="273" width="15" height="13"/>
  <!-- cleat / hanger rail -->
  <rect class="tpu" x="386" y="110" width="5" height="40"/>
  <text class="s" x="290" y="350">foot cap: face o-ring (2 mm cord), 4 x M2.5 inserts at the bottom only</text>
  <text class="s" x="290" y="363">heel = 14 mm pocket for sens1 SMA + pigtail, bulkhead SMA points down</text>
  <text class="s" x="290" y="376">dovetail rail on the back takes rim clips (6-19 mm) or the family cleat</text>
  <text class="s" x="290" y="389">FFC loop sits under the flat roof; nylon screws/standoffs at the top</text>

  <!-- IN USE, origin (640,70), 1.5 px/mm -->
  <text x="640" y="78" class="t">In use: inside face of a sump or tub</text>
  <rect class="glass" x="770" y="100" width="12" height="300"/>
  <rect class="water" x="650" y="250" width="120" height="150"/>
  <line x1="650" y1="250" x2="770" y2="250" stroke="#5a8ea3" stroke-width="1.5"/>
  <!-- device: 32 x 78 at 1.5 px/mm = 48 x 117, hanging with its back on the glass -->
  <rect class="ab" x="722" y="110" width="48" height="96" rx="6"/>
  <rect class="ab" x="740" y="200" width="30" height="21" rx="4" opacity=".8"/>
  <rect class="brow" x="723" y="111" width="46" height="29" rx="5"/>
  <circle class="coral" cx="760" cy="161" r="5"/>
  <path d="M770 112 L790 112 L790 140 L784 140 L784 118 L770 118 Z" fill="#2c4660" stroke="#0f1a24"/>
  <!-- probe -->
  <path class="coax" d="M756 221 L756 240 Q756 246 750 252 L742 262"/>
  <rect x="733" y="262" width="10" height="70" rx="5" fill="#e6e6e6" stroke="#4a4f57" transform="rotate(-20 738 262)"/>
  <!-- remote leaf panel -->
  <rect class="sol" x="650" y="96" width="47" height="36" rx="3"/>
  <path d="M697 120 Q712 140 730 205" fill="none" stroke="#2b2f2d" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text class="s" x="650" y="146">"Leaf" panel card</text>
  <text class="s" x="650" y="158">(LL200-2.4-75) near</text>
  <text class="s" x="650" y="170">the light, 1 m lead</text>
  <text class="s" x="650" y="420">Antenna stays at the top, about</text>
  <text class="s" x="650" y="432">50+ mm above the water.</text>
  <text class="s" x="650" y="444">Keep it off the sump's open top.</text>
</svg>
