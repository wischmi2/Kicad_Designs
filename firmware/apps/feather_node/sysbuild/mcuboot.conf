# No 32.768 kHz crystal (X2 is DNP): use the internal LF RC in MCUboot too.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_NRF_GRTC_TIMER_SOURCE_LFLPRC=y

# No UART on the feather (RTT only).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n

# Parallel LTO loses its temporary objects on Windows.
CONFIG_LTO_SINGLE_THREADED=y
