# Pouch gateway board (Murata Type 2FR, RW612), Wi-Fi only.
# Merged from golioth/pouch examples/zephyr/gateway boards/frdm_rw612.conf and
# boards/frdm_rw612_wifi.conf at 32ded9b (Copyright (c) 2025 Golioth, Inc., Apache-2.0).

CONFIG_NET_DHCPV4=y
CONFIG_BUILD_OUTPUT_HEX=y

CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

CONFIG_WIFI=y
CONFIG_WIFI_NXP=y

# Ensure that filesystem initializes before settings
CONFIG_FILE_SYSTEM_INIT_PRIORITY=89

# Runtime provisioning for WiFi credentials
CONFIG_WIFI_CREDENTIALS=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_SHELL_STACK_SIZE=2560

# Wifi Configuration
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_PKT_RX_COUNT=36
CONFIG_NET_PKT_TX_COUNT=36
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_BUF_DATA_SIZE=1744

# Handle WiFi Networks with Multiple DNS Servers
CONFIG_DNS_RESOLVER_MAX_SERVERS=3

# No Ethernet on this board
CONFIG_ETH_NXP_ENET=n
CONFIG_PHY_MICROCHIP_KSZ8081=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_NEED_IPV4=n
